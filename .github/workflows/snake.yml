name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # todo dia à meia-noite UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Cria ou atualiza a branch output a partir da branch atual
          git checkout -B output
          
          # Copia os arquivos gerados para a raiz
          cp -r dist/* .
          
          # Commit e push forçado (sobregrava o histórico)
          git add .
          git commit -m "Atualiza animação da cobrinha" || echo "Nada para commitar"
          git push -f origin output
